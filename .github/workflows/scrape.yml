name: Scrape grocery prices

on:
  schedule:
    - cron: "0 13,22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        id: scrape
        continue-on-error: true
        run: python run.py

      - name: Commit updated prices
        if: always()
        run: |
          git config user.name "grocery-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.json data/history.json data/status.json
          git diff --cached --quiet || git commit -m "Update prices $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Fail the run if the scrape was unhealthy
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "Scraper reported a low success rate this run - see data/status.json for details."
          exit 1
